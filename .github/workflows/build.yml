name: ESP32-C3 Build

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  IDF_VERSION: v5.1.2
  IDF_TARGET: esp32c3

jobs:
  build:
    name: Build ESP32-C3 Firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:${{ env.IDF_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build project
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c3
          idf.py build

      - name: Show build output size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: esp32c3-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
          retention-days: 30
          if-no-files-found: warn

      - name: Upload compilation database
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compile-commands
          path: build/compile_commands.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build summary
        shell: bash
        run: |
          echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ESP32-C3" >> $GITHUB_STEP_SUMMARY
          echo "**Flash Size:** 16MB" >> $GITHUB_STEP_SUMMARY
          echo "**IDF Version:** $IDF_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Binary Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/*.bin 2>/dev/null || echo "No binaries found"
          echo '```' >> $GITHUB_STEP_SUMMARY
