name: ESP32-C3 Build

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-C3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Cache ESP-IDF
        uses: actions/cache@v3
        with:
          path: |
            ~/esp/esp-idf
            ~/.espressif
          key: ${{ runner.os }}-esp-idf-v5.5.1-esp32c3-${{ hashFiles('sdkconfig.defaults') }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.1-esp32c3-
            ${{ runner.os }}-esp-idf-v5.5.1-

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Set up ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          if [ ! -d "esp-idf" ]; then
            git clone --recursive --branch v5.5.1 https://github.com/espressif/esp-idf.git
          fi
          cd esp-idf
          ./install.sh esp32c3

      - name: Build project
        run: |
          . ~/esp/esp-idf/export.sh
          idf.py set-target esp32c3
          idf.py -v build || (echo "Build failed, checking logs..." && cat build/log/idf_py_stderr_output* 2>/dev/null || true && exit 1)

      - name: Show build output size
        run: |
          . ~/esp/esp-idf/export.sh
          idf.py size
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: esp32c3-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
          retention-days: 30
          if-no-files-found: warn

      - name: Upload compilation database
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compile-commands
          path: build/compile_commands.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build summary
        run: |
          echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ESP32-C3" >> $GITHUB_STEP_SUMMARY
          echo "**Flash Size:** 16MB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Binary Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh build/*.bin 2>/dev/null || echo "No binaries found"
          echo '```' >> $GITHUB_STEP_SUMMARY
